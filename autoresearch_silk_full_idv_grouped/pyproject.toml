[project]
name = "autoresearch-silk-full-idv-grouped"
version = "0.1.0"
description = "Autonomous architecture search: predict silk fiber mechanics from grouped spidroin sequence sets with ESMC"
requires-python = ">=3.12,<3.13"
dependencies = [
    # EvolutionaryScale ESM SDK — pulls a patched transformers (registers esmc/esmfold2) + torch
    "esm @ git+https://github.com/Biohub/esm.git@c94ed8d",
    "datasets>=2.18",
    "peft>=0.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
